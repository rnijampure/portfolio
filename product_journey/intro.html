<!doctype html>
<html lang="en" data-theme="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Come with me on the journey of BuzzFest | Rohini Nijampure</title>
<meta name="description" content="An intro to BuzzFest, a product journey by Rohini Nijampure: from Apna Bakery to a live beta.">
<script>try{var t=localStorage.getItem('bf-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.65,0,.35,1);--display:"Bricolage Grotesque",Inter,system-ui,sans-serif;
--ink:#1B2333;--muted:#4B566B;--pri:#1558C0;--onpri:#fff;--acc:#FBBC04;--card:#fff;--line:#C9D3E6;--bg1:#E8F0FE;--bg2:#FEF7E0}
[data-theme=b]{--ink:#2A1233;--muted:#5E4A68;--pri:#B0225B;--acc:#FF9E7A;--line:#E8C9D6;--bg1:#FDE8EE;--bg2:#FFEFE4}
[data-theme=c]{--ink:#10261D;--muted:#3E5A4C;--pri:#1F6B4A;--acc:#F2C94C;--line:#C5DCCF;--bg1:#E3F1E7;--bg2:#FFF5CF}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--ink);font:400 1rem/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px;border-radius:6px}
.act{position:fixed;inset:0;display:flex;overflow:auto;padding:clamp(80px,11vh,110px) clamp(20px,6vw,90px) clamp(40px,7vh,70px)}
#a1{background:var(--bg1);padding-bottom:clamp(150px,24vh,210px)}
#a2{background:var(--bg2);visibility:hidden;z-index:2}
.in{margin:auto;width:min(1120px,100%);display:grid;gap:clamp(1.5rem,5vw,4rem);align-items:center}
#a1 .in{grid-template-columns:.85fr 1.15fr}
#a2 .in{grid-template-columns:.9fr 1.1fr}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.08;color:var(--ink)}

.pill{position:fixed;z-index:10;background:rgba(255,255,255,.95);color:var(--pri);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.9rem}
.top-r{top:max(12px,env(safe-area-inset-top));right:12px;padding:4px 6px 4px 16px}
.top-r a{text-decoration:underline;text-underline-offset:3px;min-height:44px;display:flex;align-items:center}
.sw{min-width:44px;min-height:44px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed=true] i{box-shadow:0 0 0 3px var(--pri)}
.prog{position:fixed;left:0;right:0;bottom:0;height:5px;z-index:10;background:rgba(0,0,0,.06)}
.prog i{display:block;height:100%;width:0;background:var(--pri);animation:prog 4.4s linear forwards}
@keyframes prog{to{width:100%}}

/* act 1 */
.badge{width:100%;max-width:380px;aspect-ratio:381/329;opacity:0;justify-self:center;filter:drop-shadow(0 18px 30px rgba(20,30,60,.22))}
.play .badge{animation:drop .7s var(--ease) .05s both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.92) rotate(-5deg)}to{opacity:1;transform:none}}
.line{font-size:clamp(2rem,4.4vw,3.6rem)}
.wd{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.14em;margin-right:.26em}
.wd>span{display:inline-block;transform:translateY(112%)}
.play .wd>span{animation:rise .55s var(--ease) calc(.3s + var(--k)*.04s) both}
@keyframes rise{to{transform:none}}
.slot{display:inline-grid;transition:width .6s var(--ease)}
.slot .s{grid-area:1/1;justify-self:start;white-space:nowrap;transform:translateY(112%);background:linear-gradient(100deg,var(--pri) 38%,var(--acc) 50%,var(--pri) 62%) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.play .slot .a{animation:rise .55s var(--ease) .5s both,out .55s var(--ease) 1.7s both,glint 1.2s linear .8s 1}
.play .slot .b{animation:rise .55s var(--ease) 1.7s both,glint 2.4s linear 2.1s infinite}
@keyframes out{to{transform:translateY(-112%)}}
@keyframes glint{from{background-position:130% 0}to{background-position:-30% 0}}
.cap{margin-top:1.1rem;font-weight:600;color:var(--muted);opacity:0}
.play .cap{animation:fade .5s var(--ease) .9s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.strip{position:absolute;left:0;right:0;bottom:clamp(20px,5vh,44px);display:flex;gap:clamp(8px,1.4vw,16px);justify-content:center;padding:0 16px}
.strip img{width:clamp(84px,11.5vw,160px);aspect-ratio:4/3;object-fit:cover;border-radius:16px;box-shadow:0 12px 26px rgba(20,30,60,.2);border:4px solid #fff;opacity:0;transform:translateY(140%) rotate(var(--rot))}
.play .strip img{animation:tile .6s var(--ease) calc(.5s + var(--k)*.06s) both}
@keyframes tile{to{opacity:1;transform:rotate(var(--rot))}}

/* act 2 */
.stack{position:relative;width:min(100%,460px);aspect-ratio:1/1.14;justify-self:center}
.stack figure{display:flex;flex-direction:column-reverse;position:absolute;background:#fff;border-radius:18px;padding:.4rem;box-shadow:0 24px 50px rgba(20,30,60,.24);opacity:0}
.stack img{display:block;width:100%;border-radius:12px}
.stack figcaption{font-size:.8rem;font-weight:600;color:var(--pri);padding:.1rem .3rem .4rem}
.c1{left:0;top:0;width:52%;transform:rotate(-5deg)}
.c2{right:0;bottom:0;width:62%;transform:rotate(3deg)}
.play2 .c1{animation:in1 .7s var(--ease) .1s both,float1 6s ease-in-out .9s infinite}
.play2 .c2{animation:in2 .7s var(--ease) .3s both,float2 6s ease-in-out 1.1s infinite}
@keyframes in1{from{opacity:0;transform:translateY(22px) rotate(-5deg)}to{opacity:1;transform:rotate(-5deg)}}
@keyframes float1{50%{transform:rotate(-5deg) translateY(-9px)}}
@keyframes float2{50%{transform:rotate(3deg) translateY(9px)}}
@keyframes in2{from{opacity:0;transform:translateY(22px) rotate(3deg)}to{opacity:1;transform:rotate(3deg)}}
.kick{font:600 1.2rem Inter,sans-serif;color:var(--muted)}
#a2 h2{font-size:clamp(2rem,4.5vw,3.6rem);margin-top:.3rem}
.mask{display:inline-grid;overflow:hidden;padding-bottom:.12em}
.w{grid-area:1/1;white-space:nowrap}
.mask .b{transform:translateY(112%);color:var(--pri)}
.play2 .mask .a{animation:out .6s var(--ease) .9s both}
.play2 .mask .b{animation:rise .6s var(--ease) .9s both}
.sub{font:700 1.3rem var(--display);margin-top:1rem;color:var(--pri)}
.r{opacity:0}
.play2 .r{animation:fade .6s var(--ease) calc(.15s + var(--i,0)*.1s) both}
.btn{display:inline-flex;align-items:center;min-height:54px;padding:.7rem 1.7rem;border-radius:999px;border:2px solid var(--acc);background:var(--acc);color:var(--ink);font:700 1.05rem Inter,sans-serif;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s;position:relative}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,30,60,.22)}
.play2 .btn::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--acc);animation:ring 2s ease-out 1.3s infinite}
@keyframes ring{to{transform:scale(1.25,1.5);opacity:0}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.4rem;margin-top:1.6rem}
.link{background:none;border:0;font:600 .95rem Inter,sans-serif;color:var(--pri);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 .3rem}
.hint{margin-top:.2rem;font-size:.9rem;color:var(--muted)}

@media (max-width:860px){
 #a1 .in,#a2 .in{grid-template-columns:1fr}
 .badge{max-width:220px}
 .stack{width:min(100%,330px)}
 #a2 .in{gap:1.4rem}
 .strip img:nth-child(n+5){display:none}
 .strip img{width:clamp(70px,21vw,120px)}
 #a1{padding-bottom:150px}
}
@media (max-height:620px) and (min-width:861px){.strip{display:none}#a1{padding-bottom:60px}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .badge,.r,.stack figure,.cap,.strip img{opacity:1}.strip img{transform:rotate(var(--rot))}.wd>span{transform:none}.slot .a{transform:none}.mask .a{display:none}.mask .b{transform:none}
 .prog{display:none}
}
</style>
</head>
